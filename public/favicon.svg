<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Dark background -->
  <rect width="48" height="48" rx="10" fill="#0C0C12"/>
  <!-- Outer orbit ring -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="rgba(200,169,110,0.3)" stroke-width="0.8"/>
  <!-- Inner orbit ring -->
  <circle cx="24" cy="24" r="11" fill="none" stroke="rgba(200,169,110,0.5)" stroke-width="0.8"/>
  <!-- 6 dots on outer ring -->
  <circle cx="24" cy="6" r="1.2" fill="rgba(200,169,110,0.5)"/>
  <circle cx="39.6" cy="15" r="1.2" fill="rgba(200,169,110,0.5)"/>
  <circle cx="39.6" cy="33" r="1.2" fill="rgba(200,169,110,0.5)"/>
  <circle cx="24" cy="42" r="1.2" fill="rgba(200,169,110,0.5)"/>
  <circle cx="8.4" cy="33" r="1.2" fill="rgba(200,169,110,0.5)"/>
  <circle cx="8.4" cy="15" r="1.2" fill="rgba(200,169,110,0.5)"/>
  <!-- Orbiting dot (top of outer ring) - highlight -->
  <circle cx="24" cy="6" r="2" fill="#C8A96E"/>
  <!-- Center dot -->
  <circle cx="24" cy="24" r="3" fill="#C8A96E"/>
</svg>
